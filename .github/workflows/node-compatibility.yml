name: Node compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:runtime
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --runInBand
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Run all real Firestore emulator tests
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar \
            --output "$RUNNER_TEMP/firestore.jar"
          java -jar "$RUNNER_TEMP/firestore.jar" --host 127.0.0.1 --port 18089 \
            --project_id demo-momentum-review --single_project_mode --single_project_mode_error \
            > "$RUNNER_TEMP/firestore.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18089/ > /dev/null; then break; fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/firestore.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18089/ > /dev/null
          npm run test:emulator
